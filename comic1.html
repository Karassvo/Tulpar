<style>
/* Layout: a noir comic book. Dark gutters, ink-bordered panels in rows (one wide panel, then two), yellow narration boxes, white lettering balloons, SFX bursts. Single committed dark look. */
:root{
  --gutter:#0b0e17; --ink:#05070c; --paper:#f4efe2; --night:#141a2e; --night-2:#1f2847;
  --cape:#a3202e; --gold:#f2b632; --cyan:#7fe7ff; --caption:#f5cf3a; --red:#e2412f; --soft:#9aa6bf;
  --f-sfx:"Bangers","Impact","Arial Black",sans-serif;
  --f-letter:"Comic Neue","Comic Sans MS","Trebuchet MS",sans-serif;
  --f-title:"Unbounded","Arial Black",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:64px;scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--gutter);color:var(--paper);font-family:var(--f-letter);font-size:17px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--gutter)}
a{color:var(--gold)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.book{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:flex;flex-direction:column;gap:46px}

/* top nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--gutter);border-bottom:2px solid var(--ink)}
.nav .in{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.nav .in::-webkit-scrollbar{display:none}
.nav b{font-family:var(--f-sfx);font-size:1.25rem;letter-spacing:.06em;color:var(--gold);margin-right:8px;white-space:nowrap}
.nav a{font-family:var(--f-sfx);font-size:1rem;letter-spacing:.06em;text-decoration:none;color:var(--paper);border:2px solid var(--night-2);border-radius:6px;padding:.15rem .5rem;white-space:nowrap}
.nav a:hover{border-color:var(--gold);color:var(--gold)}

/* page */
.page{display:flex;flex-direction:column;gap:12px}
.issue-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;border-bottom:3px solid var(--gold);padding-bottom:6px}
.issue-head .no{font-family:var(--f-sfx);font-size:1.1rem;letter-spacing:.12em;color:var(--gold)}
.issue-head h2{font-family:var(--f-sfx);font-weight:400;font-size:clamp(2rem,6vw,3.2rem);letter-spacing:.04em;line-height:1;margin:0;color:var(--paper);text-shadow:3px 3px 0 var(--cape)}
.issue-head .topic{font-size:.95rem;color:var(--soft);font-weight:700}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{position:relative;background:var(--night);border:4px solid var(--ink);outline:2px solid var(--paper);outline-offset:-8px;overflow:hidden;container-type:inline-size;min-width:0}
.panel.wide{grid-column:1/-1}
.panel svg.art{display:block;width:100%;height:auto}
.panel::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.3px);background-size:6px 6px;mix-blend-mode:screen}
@media (max-width:640px){.row{grid-template-columns:1fr}}

/* lettering */
.bub{position:absolute;z-index:2;background:#fff;color:#0a0a0a;border:2.5px solid var(--ink);border-radius:46%/40%;padding:.55em .9em;font-weight:700;line-height:1.22;text-align:center;font-size:max(11.5px,3.55cqw)}
.wide .bub,.wide .cap,.wide .sfx{font-size:max(11.5px,1.85cqw)}
.bub::after{content:"";position:absolute;width:16px;height:16px;background:#fff;border:2.5px solid var(--ink);border-top:0;border-left:0;bottom:-10px;transform:rotate(45deg)}
.bub.tl::after{left:22%} .bub.tr::after{right:22%} .bub.none::after{display:none}
.bub.think{border-radius:50%;border-style:dashed}
.bub.think::after{display:none}
.bub.villain{background:#ffe3df}
.bub.villain::after{background:#ffe3df}
.bub.shout{border-radius:8px;transform:rotate(-2deg);font-size:max(12.5px,4cqw)}
.wide .bub.shout{font-size:max(12.5px,2.1cqw)}
.cap{position:absolute;z-index:2;background:var(--caption);color:#0a0a0a;border:2.5px solid var(--ink);padding:.35em .65em;font-weight:700;line-height:1.25;font-size:max(11.5px,3.4cqw);box-shadow:3px 3px 0 var(--ink)}
.sfx{position:absolute;z-index:2;font-family:var(--f-sfx);font-size:max(26px,9cqw)!important;letter-spacing:.04em;line-height:.9;color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--cape);transform:rotate(-8deg);white-space:nowrap}
.wide .sfx{font-size:max(26px,5.2cqw)!important}
.sfx.red{color:var(--red);text-shadow:4px 4px 0 var(--ink)}
.file{border:3px solid var(--gold);background:var(--night);padding:.75rem 1rem;display:grid;grid-template-columns:auto 1fr;gap:.3rem 1rem;align-items:start}
.file .lbl{font-family:var(--f-sfx);font-size:1.15rem;letter-spacing:.08em;color:var(--gold);line-height:1.2}
.file p{margin:0;font-size:1rem}
.file code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;color:var(--cyan)}
@media (max-width:560px){.file{grid-template-columns:1fr}}

/* cover */
.cover{position:relative;border:5px solid var(--ink);outline:3px solid var(--gold);outline-offset:-12px;overflow:hidden;background:var(--night);container-type:inline-size}
.cover svg{display:block;width:100%;height:auto}
.cover .ct{position:absolute;left:5%;top:5%;right:5%;display:flex;flex-direction:column;gap:.4cqw}
.cover .price{font-family:var(--f-sfx);font-size:max(13px,2.2cqw);letter-spacing:.12em;color:var(--gold)}
.cover h1{font-family:var(--f-sfx);font-weight:400;font-size:max(48px,13cqw);line-height:.85;letter-spacing:.03em;margin:0;color:var(--paper);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:7px 7px 0 var(--cape)}
.cover .sub{font-family:var(--f-sfx);font-size:max(18px,4.2cqw);letter-spacing:.06em;color:var(--gold);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.cover .team{position:absolute;left:5%;bottom:5%;right:5%;font-weight:700;font-size:max(12px,1.9cqw);color:var(--paper);background:rgba(5,7,12,.72);padding:.5em .8em;border-left:6px solid var(--gold)}
.intro{display:flex;flex-direction:column;gap:.7rem;max-width:68ch}
.intro p{margin:0}
.intro .k{font-family:var(--f-sfx);letter-spacing:.08em;color:var(--gold);font-size:1.2rem}
.credits{border-top:3px solid var(--gold);padding-top:1rem;display:flex;flex-direction:column;gap:.8rem;font-size:.95rem;color:var(--soft)}
.credits h3{font-family:var(--f-sfx);font-weight:400;font-size:1.8rem;letter-spacing:.05em;color:var(--paper);margin:0}
.credits table{border-collapse:collapse;width:100%;font-size:.92rem}
.credits td{border-bottom:1px solid var(--night-2);padding:.45rem .5rem;vertical-align:top;color:var(--paper)}
.credits td:first-child{color:var(--gold);font-weight:700;width:28%}
@media (prefers-reduced-motion: no-preference){
  .sfx{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes pop{from{transform:rotate(-8deg) scale(.6)}to{transform:rotate(-8deg) scale(1)}}
}
</style>

<script>

/* ================= ART KIT ================= */
var UID = 0;
function rng(seed){ var s = seed >>> 0; return function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

function sky(w, h, o){
  o = o || {}; var id = "g" + (++UID);

}
function baiterek(x, base, k){
  var t = base - 230 * k;
  return '<g stroke="' + INK + '" stroke-width="2">' +
    '<path d="M' + (x - 16 * k) + ' ' + base + ' L' + (x - 4 * k) + ' ' + (t + 30 * k) + ' L' + (x + 4 * k) + ' ' + (t + 30 * k) + ' L' + (x + 16 * k) + ' ' + base + 'Z" fill="#cfd6e6"/>' +
    '<path d="M' + (x - 4 * k) + ' ' + (t + 30 * k) + ' C' + (x - 30 * k) + ' ' + (t + 10 * k) + ' ' + (x - 30 * k) + ' ' + (t - 4 * k) + ' ' + (x - 22 * k) + ' ' + (t - 14 * k) + 'M' + (x + 4 * k) + ' ' + (t + 30 * k) + ' C' + (x + 30 * k) + ' ' + (t + 10 * k) + ' ' + (x + 30 * k) + ' ' + (t - 4 * k) + ' ' + (x + 22 * k) + ' ' + (t - 14 * k) + '" fill="none" stroke="#cfd6e6" stroke-width="' + (3 * k) + '"/>' +

function khanShatyr(x, base, k){

/* Plain delivery robot before the cape */
function bot(x, y, s, dizzy){

/* Bürkit the golden eagle. Origin at body centre. */
function eagle(x, y, s, flip){

/* Villain silhouette with glowing eyes. o: {c: coat, h: hat type, l: chest letter} */

   file:"<b>Conditional probability</b>: <code>P(A|B) = P(A,B) / P(B)</code>, so knowing B shrinks the world to the cases where B is true. <b>Bayes</b>: <code>P(H|E) = P(E|H)·P(H) / P(E)</code>. When the condition is rare, most positive tests are false: the <b>base-rate fallacy</b>. A <b>Bayesian network</b> = a DAG + a probability table per node; with rain → sprinkler → wet grass, P(rain | wet grass) ≈ 35.8%, up from 20%." },

   file:"A rational choice maximises <b>expected utility</b>: EU(a) = Σ P(outcome)·U(outcome). <b>Supervised</b> learning uses labels, <b>unsupervised</b> finds structure (K-means), <b>reinforcement</b> learns from reward. Classical models: <b>linear regression</b> <code>ŷ = wx + b</code> (minimise MSE), <b>logistic regression</b> <code>σ(wᵀx + b)</code> for probabilities, <b>Naive Bayes</b> <code>P(C|x) ∝ P(C)·Π P(xᵢ|C)</code> (spam example: 71%), decision trees and random forests. Test on unseen data; watch for <b>overfitting</b>, data leakage and distribution shift. Here accuracy is 96.8%, recall 90%, precision 37.5%, F1 ≈ 0.53." },
